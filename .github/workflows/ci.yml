name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up primary Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Public data and Git identity guard
        run: python3 scripts/check_public_data.py

      - name: Shell syntax
        run: |
          sh -n scripts/install-xray-direct.sh
          sh -n scripts/healthcheck.sh
          sh -n scripts/backup.sh
          sh -n scripts/preflight.sh
          sh -n scripts/probe-device-discovery-readonly.sh
          sh -n scripts/probe-netcraze-policy-contract.sh
          sh -n templates/S23xray-direct

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/check_public_data.py
          python3 -m py_compile scripts/routerkit_private_io.py
          python3 -m py_compile scripts/routerkit_profile_network.py
          python3 -m py_compile scripts/routerkit_profile_source.py
          python3 -m py_compile scripts/routerkit-profile-source.py
          python3 -m py_compile scripts/generate-xray-profiles.py
          python3 -m py_compile scripts/routerkit-wizard.py
          python3 -m py_compile scripts/routerkit-plan.py
          python3 -m py_compile scripts/routerkit-bootstrap.py
          python3 -m py_compile scripts/routerkit_artifact_network.py
          python3 -m py_compile scripts/routerkit_bootstrap_apply.py
          python3 -m py_compile scripts/routerkit.py
          python3 -m py_compile scripts/routerkit-autostart.py
          python3 -m py_compile scripts/routerkit_autostart.py
          python3 -m py_compile scripts/routerkit_devices.py
          python3 -m py_compile scripts/routerkit-devices.py
          python3 -m py_compile scripts/routerkit_netcraze_plan.py
          python3 -m py_compile scripts/routerkit-netcraze-plan.py
          python3 -m py_compile scripts/routerkit_netcraze_live.py
          python3 -m py_compile scripts/routerkit_netcraze_live_compat.py
          python3 -m py_compile scripts/routerkit-netcraze-live.py
          python3 -m py_compile scripts/routerkit_netcraze_external.py
          python3 -m py_compile scripts/routerkit-netcraze-external.py
          python3 -m py_compile scripts/routerkit_live_install.py
          python3 -m py_compile scripts/routerkit-live-install.py
          python3 -m py_compile scripts/validate_routerkit_platform_compatibility.py

      - name: Platform compatibility contract
        run: |
          python3 scripts/validate_routerkit_platform_compatibility.py
          python3 -m unittest tests.test_routerkit_platform_compatibility -v

      - name: Focused device discovery tests
        run: |
          python3 -m unittest tests.test_routerkit_devices -v
          python3 -m unittest tests.test_routerkit_devices_cli -v
          python3 -m unittest tests.test_routerkit_device_adapters -v
          python3 -m unittest tests.test_routerkit_device_probe -v
          python3 -m unittest tests.test_routerkit_setup_devices -v

      - name: Focused Netcraze plan tests
        run: |
          python3 -m unittest tests.test_routerkit_netcraze_plan -v
          python3 -m unittest tests.test_routerkit_netcraze_plan_cli -v
          python3 -m unittest tests.test_routerkit_netcraze_simulator -v
          python3 -m unittest tests.test_routerkit_setup_netcraze_plan -v
          python3 -m unittest tests.test_routerkit_netcraze_probe -v
          python3 -m unittest tests.test_routerkit_netcraze_live -v
          python3 -m unittest tests.test_routerkit_netcraze_live_compat -v
          python3 -m unittest tests.test_routerkit_netcraze_live_entrypoint -v
          python3 -m unittest tests.test_routerkit_netcraze_external -v

      - name: Focused autostart tests
        run: |
          python3 -m unittest tests.test_routerkit_autostart -v
          python3 -m unittest tests.test_routerkit_autostart_signals -v
          python3 -m unittest tests.test_routerkit_s23xray_direct -v
          python3 -m unittest tests.test_routerkit_setup_autostart -v

      - name: Focused live-install orchestration tests
        run: |
          python3 -m unittest tests.test_routerkit_live_install -v

      - name: Python tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Device fixture guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ipaddress
          import json
          import re
          import sys

          allowed_v4 = [
              ipaddress.ip_network("192.0.2.0/24"),
              ipaddress.ip_network("198.51.100.0/24"),
              ipaddress.ip_network("203.0.113.0/24"),
          ]
          allowed_v6 = [ipaddress.ip_network("2001:db8::/32")]
          roots = [Path("tests/fixtures/devices"), Path("tests/fixtures/netcraze")]
          ip_pattern = re.compile(r"\b(?:\d{1,3}\.){3}\d{1,3}\b|2001:db8:[0-9a-fA-F:]*")
          mac_pattern = re.compile(r"\b([0-9a-fA-F]{2})(?::[0-9a-fA-F]{2}){5}\b")

          findings = []

          def json_strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, list):
                  for item in value:
                      yield from json_strings(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from json_strings(item)

          for root in roots:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  text = path.read_text(encoding="utf-8")
                  if path.suffix == ".json":
                      for value in json_strings(json.loads(text)):
                          try:
                              address = ipaddress.ip_address(value)
                          except ValueError:
                              continue
                          networks = allowed_v4 if address.version == 4 else allowed_v6
                          exact_local_endpoint = root.name == "netcraze" and str(address) in {"127.0.0.1", "::1"}
                          if not exact_local_endpoint and not any(address in network for network in networks):
                              findings.append(f"{path}: non-documentation address {value}")
                  for match in ip_pattern.finditer(text):
                      value = match.group(0)
                      try:
                          address = ipaddress.ip_address(value)
                      except ValueError:
                          continue
                      networks = allowed_v4 if address.version == 4 else allowed_v6
                      exact_local_endpoint = root.name == "netcraze" and str(address) in {"127.0.0.1", "::1"}
                      if not exact_local_endpoint and not any(address in network for network in networks):
                          findings.append(f"{path}: non-documentation address {value}")
                  for match in mac_pattern.finditer(text):
                      first = int(match.group(1), 16)
                      if first & 0x01 or not first & 0x02:
                          findings.append(f"{path}: MAC is not unicast locally administered")

          if findings:
              print("Device fixture guard failed:")
              print("\n".join(findings))
              sys.exit(1)
          print("Device fixture guard passed.")
          PY

  address-policy:
    name: Address policy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Destination and artifact policy tests
        run: |
          python -m unittest tests.test_routerkit_profile_network.DestinationPolicyTests -v
          python -m unittest tests.test_routerkit_artifact_network -v
          python -m unittest tests.test_check_public_data -v
